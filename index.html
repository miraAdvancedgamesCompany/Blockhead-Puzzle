<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Blockhead Puzzle</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Titan+One&family=Luckiest+Guy&display=swap');

    :root {
      --cream: #FFF5D6;
      --ink: #1A0A00;
      --red: #D62828;
      --red2: #F46036;
      --yellow: #F7C948;
      --blue: #2D6A9F;
      --green: #3A7D44;
      --purple: #6B3FA0;
      --board-bg: #3B1F0A;
      --cell-empty: #6E4225;
      --cell-border: #3D1800;
      --shadow: #1A0A00;
      --gold: #FFD700;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #8B3A1A;
      background-image:
        radial-gradient(ellipse at 20% 20%, #C85A2A 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, #5C1A08 0%, transparent 50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      font-family: 'Titan One', cursive;
      min-height: 100vh;
    }

    /* ── Halftone overlay (Cuphead feel) ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image: radial-gradient(circle, rgba(0, 0, 0, .08) 1px, transparent 1px);
      background-size: 6px 6px;
    }

    /* ═══════════════════════════════════════
   HEADER
═══════════════════════════════════════ */
    #header {
      position: relative;
      z-index: 10;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px 4px;
      max-width: 500px;
      gap: 6px;
    }

    /* Pause & Mute circular buttons */
    #pause-btn,
    #mute-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--ink);
      border: 2.5px solid var(--yellow);
      color: var(--cream);
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 2px 2px 0 rgba(247, 201, 72, 0.5);
      transition: transform 0.1s, box-shadow 0.1s;
      flex-shrink: 0;
      line-height: 1;
      padding: 0;
    }

    #pause-btn:active,
    #mute-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0 0 0 var(--yellow);
    }

    /* High Score box */
    #highscore-box {
      background: var(--ink);
      border: 2.5px solid var(--yellow);
      border-radius: 10px;
      padding: 3px 8px;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.3);
    }

    #highscore-icon {
      font-size: 13px;
      line-height: 1;
    }

    #highscore-val {
      font-family: 'Luckiest Guy', cursive;
      font-size: clamp(13px, 3.2vw, 17px);
      color: var(--cream);
      line-height: 1;
    }

    .new-best-flash {
      animation: newBestFlash 0.5s ease both;
    }

    @keyframes newBestFlash {
      0% {
        transform: scale(1);
        color: var(--cream)
      }

      50% {
        transform: scale(1.4);
        color: var(--yellow)
      }

      100% {
        transform: scale(1);
        color: var(--cream)
      }
    }

    /* Score box */
    #score-box {
      background: var(--ink);
      border: 3px solid var(--yellow);
      border-radius: 12px;
      padding: 4px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 3px 3px 0 var(--yellow);
    }

    #score-label {
      font-size: 9px;
      color: var(--yellow);
      letter-spacing: 1px;
    }

    #score-val {
      font-family: 'Luckiest Guy', cursive;
      font-size: clamp(17px, 4.5vw, 24px);
      color: var(--cream);
      line-height: 1;
    }

    #score-val.bump {
      animation: scoreBump 0.25s ease both;
    }

    @keyframes scoreBump {
      0% {
        transform: scale(1)
      }

      50% {
        transform: scale(1.25)
      }

      100% {
        transform: scale(1)
      }
    }

    /* Coins box */
    #coins-box {
      background: var(--ink);
      border: 2.5px solid var(--gold);
      border-radius: 10px;
      padding: 3px 8px;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.3);
    }

    #coins-icon {
      font-size: 13px;
      line-height: 1;
    }

    #coins-val {
      font-family: 'Luckiest Guy', cursive;
      font-size: clamp(13px, 3.2vw, 17px);
      color: var(--gold);
      line-height: 1;
    }

    #coins-box.bump {
      animation: coinBoxBump 0.3s ease both;
    }

    @keyframes coinBoxBump {
      0% {
        transform: scale(1)
      }

      50% {
        transform: scale(1.15)
      }

      100% {
        transform: scale(1)
      }
    }

    /* ═══════════════════════════════════════
   LEVEL ROW
═══════════════════════════════════════ */
    #level-row {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    #level-txt {
      font-family: 'Luckiest Guy', cursive;
      color: var(--cream);
      font-size: 13px;
      text-shadow: 1px 1px 0 var(--ink);
      letter-spacing: 1px;
    }

    #progress-bar-bg {
      width: 120px;
      height: 12px;
      background: var(--ink);
      border-radius: 8px;
      border: 2px solid var(--ink);
      overflow: hidden;
    }

    #progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--yellow), var(--red2));
      border-radius: 8px;
      width: 0%;
      transition: width 0.4s ease;
    }

    /* ═══════════════════════════════════════
   BOARD
═══════════════════════════════════════ */
    #board-wrapper {
      position: relative;
      z-index: 5;
      margin: 6px 0 6px;
      background: var(--board-bg);
      border: 5px solid var(--ink);
      border-radius: 14px;
      padding: 8px;
      box-shadow:
        8px 8px 0 var(--ink),
        inset 0 0 20px rgba(0, 0, 0, 0.6);
    }

    #board {
      display: grid;
      gap: var(--gap);
      --gap: 3px;
    }

    .cell {
      background: var(--cell-empty);
      border-radius: 4px;
      border: 2px solid var(--cell-border);
      transition: background 0.08s, transform 0.08s, box-shadow 0.08s;
      position: relative;
      overflow: hidden;
    }

    .cell::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 3px;
      width: 40%;
      height: 30%;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 3px;
    }

    .cell.highlight {
      background: rgba(247, 201, 72, 0.35);
      border-color: var(--yellow);
      transform: scale(1.08);
      box-shadow: 0 0 10px var(--yellow);
    }

    .cell.highlight-bad {
      background: rgba(214, 40, 40, 0.4);
      border-color: var(--red);
      transform: scale(1.05);
      box-shadow: 0 0 10px var(--red);
    }

    .cell.filled {
      border-color: var(--ink);
    }

    .cell.pop-in {
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.5) both;
    }

    @keyframes popIn {
      0% {
        transform: scale(0) rotate(-10deg);
        opacity: 0
      }

      60% {
        transform: scale(1.25) rotate(3deg)
      }

      100% {
        transform: scale(1) rotate(0deg);
        opacity: 1
      }
    }

    .cell.clear-pop {
      animation: clearPop 0.3s ease-out both;
    }

    @keyframes clearPop {
      0% {
        transform: scale(1);
        opacity: 1
      }

      50% {
        transform: scale(1.4) rotate(8deg);
        opacity: 0.7
      }

      100% {
        transform: scale(0) rotate(-8deg);
        opacity: 0
      }
    }

    /* ── Hammer mode ── */
    #board-wrapper.hammer-mode {
      cursor: crosshair;
    }

    #board-wrapper.hammer-mode .cell.filled {
      cursor: crosshair;
      transition: transform 0.12s, filter 0.12s, box-shadow 0.12s;
    }

    #board-wrapper.hammer-mode .cell.filled:hover {
      transform: scale(1.12);
      filter: brightness(1.3);
      box-shadow: 0 0 14px rgba(255, 60, 60, 0.6);
    }

    .cell.hammer-smash {
      animation: hammerSmash 0.35s ease-out both;
    }

    @keyframes hammerSmash {
      0% {
        transform: scale(1);
        opacity: 1
      }

      30% {
        transform: scale(1.6) rotate(10deg);
        opacity: 0.8
      }

      100% {
        transform: scale(0) rotate(-15deg);
        opacity: 0
      }
    }

    /* ═══════════════════════════════════════
   INVENTORY
═══════════════════════════════════════ */
    #inventory {
      position: relative;
      z-index: 5;
      display: flex;
      gap: 14px;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 16px;
      border: 3px solid var(--ink);
      box-shadow: 4px 4px 0 var(--ink);
      min-height: 90px;
      width: calc(100% - 24px);
      max-width: 480px;
      margin: 0 12px;
    }

    #inventory.flash-hint {
      animation: flashHint 0.5s ease both;
    }

    @keyframes flashHint {

      0%,
      100% {
        box-shadow: 4px 4px 0 var(--ink)
      }

      50% {
        box-shadow: 0 0 22px var(--yellow), 4px 4px 0 var(--ink)
      }
    }

    .shape-slot {
      width: 86px;
      height: 86px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
      border-radius: 10px;
      border: 2.5px solid transparent;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .shape-slot.selected {
      border-color: var(--yellow);
      box-shadow: 0 0 14px rgba(247, 201, 72, 0.5);
      animation: selectedPulse 1.4s ease-in-out infinite;
    }

    @keyframes selectedPulse {

      0%,
      100% {
        box-shadow: 0 0 10px rgba(247, 201, 72, 0.4)
      }

      50% {
        box-shadow: 0 0 22px rgba(247, 201, 72, 0.7)
      }
    }

    .shape-ghost {
      opacity: 0.22;
      pointer-events: none;
    }

    /* ═══════════════════════════════════════
   POWER-UPS BAR
═══════════════════════════════════════ */
    #powerups {
      position: relative;
      z-index: 5;
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      padding: 6px 14px;
      margin-top: 6px;
      width: calc(100% - 24px);
      max-width: 480px;
    }

    .powerup-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--ink);
      border: 3px solid var(--yellow);
      border-radius: 12px;
      padding: 5px 12px 4px;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--ink);
      transition: transform 0.1s, box-shadow 0.1s, opacity 0.2s;
      flex: 1;
      max-width: 120px;
      gap: 1px;
    }

    .powerup-btn:active:not(.disabled) {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--ink);
    }

    .powerup-btn.disabled {
      opacity: 0.35;
      filter: grayscale(0.4);
      cursor: not-allowed;
    }

    .powerup-btn.active {
      background: var(--yellow);
      border-color: var(--cream);
      box-shadow: 0 0 14px var(--yellow), 3px 3px 0 var(--ink);
    }

    .powerup-btn.used {
      animation: puUsed 0.35s ease both;
    }

    @keyframes puUsed {
      0% {
        transform: scale(1)
      }

      40% {
        transform: scale(0.85)
      }

      100% {
        transform: scale(1)
      }
    }

    .pu-icon {
      font-size: 18px;
      line-height: 1;
    }

    .powerup-btn.active .pu-icon {
      filter: brightness(0);
    }

    .pu-label {
      font-family: 'Titan One', cursive;
      font-size: 8px;
      color: var(--cream);
      letter-spacing: 0.5px;
      line-height: 1;
    }

    .powerup-btn.active .pu-label {
      color: var(--ink);
    }

    .pu-cost {
      font-family: 'Luckiest Guy', cursive;
      font-size: 10px;
      color: var(--gold);
      line-height: 1;
    }

    .powerup-btn.active .pu-cost {
      color: var(--ink);
    }

    /* ═══════════════════════════════════════
   DRAGGABLE SHAPES
═══════════════════════════════════════ */
    .shape {
      display: grid;
      gap: 3px;
      position: absolute;
      cursor: grab;
      z-index: 10;
      transition: transform 0.12s cubic-bezier(0.175, 0.885, 0.32, 1.5), filter 0.12s;
      transform-origin: center center;
      will-change: transform;
    }

    .shape:not(.dragging) {
      animation: shapeBounce 2.2s ease-in-out infinite;
    }

    @keyframes shapeBounce {

      0%,
      100% {
        transform: translateY(0) rotate(-1.5deg)
      }

      50% {
        transform: translateY(-4px) rotate(1.5deg)
      }
    }

    .shape.dragging {
      cursor: grabbing;
      z-index: 1000;
      transition: none;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.7));
      pointer-events: none;
      animation: none;
    }

    .shape.snap-back {
      animation: snapBack 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.5) both;
    }

    @keyframes snapBack {
      0% {
        transform: scale(1.1)
      }

      60% {
        transform: scale(0.9)
      }

      100% {
        transform: scale(1)
      }
    }

    .shape.placed {
      animation: placedPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.5) both;
    }

    @keyframes placedPop {
      0% {
        transform: scale(1.2)
      }

      60% {
        transform: scale(0.85)
      }

      100% {
        transform: scale(1)
      }
    }

    .shape.refresh-spin {
      animation: refreshSpin 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.5) both;
    }

    @keyframes refreshSpin {
      0% {
        transform: scale(0) rotate(-180deg);
        opacity: 0
      }

      100% {
        transform: scale(1) rotate(0deg);
        opacity: 1
      }
    }

    /* ── BLOCK (individual cell of shape) ── */
    .block {
      width: 100%;
      height: 100%;
      border-radius: 5px;
      border: 2.5px solid rgba(0, 0, 0, 0.55);
      position: relative;
      overflow: hidden;
    }

    .block::before {
      content: '';
      position: absolute;
      top: 2px;
      left: 4px;
      width: 45%;
      height: 35%;
      background: rgba(255, 255, 255, 0.35);
      border-radius: 3px;
    }

    .block::after {
      content: '';
      position: absolute;
      bottom: 2px;
      right: 3px;
      width: 30%;
      height: 22%;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 2px;
    }

    /* ═══════════════════════════════════════
   SCORE POP & COIN POP
═══════════════════════════════════════ */
    .score-pop {
      position: fixed;
      font-family: 'Luckiest Guy', cursive;
      font-size: 28px;
      color: var(--yellow);
      text-shadow: 2px 2px 0 var(--ink), -1px -1px 0 var(--ink);
      pointer-events: none;
      z-index: 9999;
      animation: scorePop 1s ease-out both;
    }

    @keyframes scorePop {
      0% {
        transform: scale(0.5) translateY(0);
        opacity: 1
      }

      60% {
        transform: scale(1.3) translateY(-30px);
        opacity: 1
      }

      100% {
        transform: scale(1) translateY(-60px);
        opacity: 0
      }
    }

    .coin-pop {
      position: fixed;
      font-family: 'Luckiest Guy', cursive;
      font-size: 20px;
      color: var(--gold);
      text-shadow: 2px 2px 0 var(--ink), -1px -1px 0 var(--ink);
      pointer-events: none;
      z-index: 9999;
      animation: coinPopAnim 1s ease-out both;
    }

    @keyframes coinPopAnim {
      0% {
        transform: scale(0.5) translateY(0);
        opacity: 1
      }

      60% {
        transform: scale(1.2) translateY(-20px);
        opacity: 1
      }

      100% {
        transform: scale(1) translateY(-45px);
        opacity: 0
      }
    }

    /* ── COMBO BANNER ── */
    #combo-banner {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-family: 'Luckiest Guy', cursive;
      font-size: clamp(36px, 10vw, 60px);
      color: var(--yellow);
      text-shadow: 4px 4px 0 var(--ink), -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink);
      pointer-events: none;
      z-index: 9998;
      white-space: nowrap;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.5);
    }

    #combo-banner.show {
      transform: translate(-50%, -50%) scale(1) rotate(-5deg);
    }

    /* ═══════════════════════════════════════
   PAUSE OVERLAY
═══════════════════════════════════════ */
    #pause-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 8500;
    }

    #pause-overlay::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(255, 255, 255, .06) 1px, transparent 1px);
      background-size: 8px 8px;
      pointer-events: none;
    }

    #pause-menu {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      z-index: 1;
    }

    #pause-menu h2 {
      font-family: 'Luckiest Guy', cursive;
      font-size: clamp(38px, 11vw, 64px);
      color: var(--yellow);
      text-shadow: 5px 5px 0 var(--ink), -2px -2px 0 var(--ink);
      animation: pauseWobble 2s ease-in-out infinite;
    }

    @keyframes pauseWobble {

      0%,
      100% {
        transform: rotate(-2deg)
      }

      50% {
        transform: rotate(2deg)
      }
    }

    .pause-menu-btn {
      font-family: 'Luckiest Guy', cursive;
      font-size: clamp(16px, 4.5vw, 22px);
      background: var(--ink);
      color: var(--cream);
      border: 3px solid var(--yellow);
      border-radius: 14px;
      padding: 10px 30px;
      cursor: pointer;
      box-shadow: 4px 4px 0 var(--yellow);
      transition: transform 0.1s, box-shadow 0.1s;
      letter-spacing: 1px;
      min-width: 200px;
      text-align: center;
    }

    .pause-menu-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0 var(--yellow);
    }

    /* ═══════════════════════════════════════
   GAME OVER
═══════════════════════════════════════ */
    #gameover {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9000;
    }

    #gameover h1 {
      font-family: 'Luckiest Guy', cursive;
      font-size: clamp(40px, 12vw, 72px);
      color: var(--red);
      text-shadow: 5px 5px 0 var(--ink);
      animation: goWobble 0.6s ease-out both;
    }

    @keyframes goWobble {
      0% {
        transform: scale(0) rotate(-10deg)
      }

      60% {
        transform: scale(1.2) rotate(5deg)
      }

      100% {
        transform: scale(1) rotate(-3deg)
      }
    }

    #gameover .final-score {
      font-family: 'Luckiest Guy', cursive;
      color: var(--cream);
      font-size: clamp(22px, 6vw, 36px);
      margin: 8px 0 2px;
      text-shadow: 3px 3px 0 var(--ink);
    }

    #gameover .final-best {
      font-family: 'Luckiest Guy', cursive;
      color: var(--yellow);
      font-size: clamp(16px, 4vw, 24px);
      text-shadow: 2px 2px 0 var(--ink);
    }

    #gameover .final-coins {
      font-family: 'Luckiest Guy', cursive;
      color: var(--gold);
      font-size: clamp(14px, 3.5vw, 20px);
      margin: 4px 0;
      text-shadow: 2px 2px 0 var(--ink);
    }

    #new-best-banner {
      font-family: 'Luckiest Guy', cursive;
      font-size: clamp(24px, 7vw, 40px);
      color: #FF6B6B;
      text-shadow: 3px 3px 0 var(--ink), -1px -1px 0 var(--ink);
      display: none;
      animation: newBestBounce 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.5) both;
      margin-bottom: 4px;
    }

    @keyframes newBestBounce {
      0% {
        transform: scale(0) rotate(-15deg)
      }

      60% {
        transform: scale(1.3) rotate(5deg)
      }

      100% {
        transform: scale(1) rotate(-3deg)
      }
    }

    #restart-btn {
      margin-top: 14px;
      font-family: 'Luckiest Guy', cursive;
      font-size: clamp(18px, 5vw, 26px);
      background: var(--yellow);
      color: var(--ink);
      border: 4px solid var(--ink);
      border-radius: 14px;
      padding: 10px 32px;
      cursor: pointer;
      box-shadow: 5px 5px 0 var(--ink);
      transition: transform 0.1s, box-shadow 0.1s;
      letter-spacing: 1px;
    }

    #restart-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 2px 2px 0 var(--ink);
    }

    /* ── Sparkle particles ── */
    .spark {
      position: fixed;
      pointer-events: none;
      z-index: 9997;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      animation: sparkFly 0.7s ease-out both;
    }

    @keyframes sparkFly {
      0% {
        transform: translate(0, 0) scale(1);
        opacity: 1
      }

      100% {
        transform: translate(var(--tx), var(--ty)) scale(0);
        opacity: 0
      }
    }

    /* Screen shake */
    @keyframes shake {

      0%,
      100% {
        transform: translate(0, 0)
      }

      20% {
        transform: translate(-4px, 3px)
      }

      40% {
        transform: translate(4px, -3px)
      }

      60% {
        transform: translate(-3px, 2px)
      }

      80% {
        transform: translate(3px, -2px)
      }
    }

    .shake {
      animation: shake 0.35s ease both;
    }
  </style>
</head>

<body>

  <!-- ═══ HEADER ═══ -->
  <div id="header">
    <button id="pause-btn" onclick="togglePause()">⏸</button>
    <div id="highscore-box">
      <span id="highscore-icon">🏆</span>
      <span id="highscore-val">0</span>
    </div>
    <div id="score-box">
      <div id="score-label">SCORE</div>
      <div id="score-val">0</div>
    </div>
    <div id="coins-box">
      <span id="coins-icon">🪙</span>
      <span id="coins-val">0</span>
    </div>
    <button id="mute-btn" onclick="toggleMute()">🔊</button>
  </div>

  <!-- ═══ LEVEL ROW ═══ -->
  <div id="level-row">
    <div id="level-txt">LV 1</div>
    <div id="progress-bar-bg">
      <div id="progress-bar"></div>
    </div>
  </div>

  <!-- ═══ BOARD ═══ -->
  <div id="board-wrapper">
    <div id="board"></div>
  </div>

  <!-- ═══ INVENTORY ═══ -->
  <div id="inventory"></div>

  <!-- ═══ POWER-UPS ═══ -->
  <div id="powerups">
    <button class="powerup-btn disabled" id="btn-rotate" onclick="usePowerRotate()">
      <span class="pu-icon">🔄</span>
      <span class="pu-label">ROTATE</span>
      <span class="pu-cost">🪙20</span>
    </button>
    <button class="powerup-btn disabled" id="btn-hammer" onclick="usePowerHammer()">
      <span class="pu-icon">🔨</span>
      <span class="pu-label">HAMMER</span>
      <span class="pu-cost">🪙30</span>
    </button>
    <button class="powerup-btn disabled" id="btn-refresh" onclick="usePowerRefresh()">
      <span class="pu-icon">🔃</span>
      <span class="pu-label">REFRESH</span>
      <span class="pu-cost">🪙40</span>
    </button>
  </div>

  <!-- ═══ COMBO BANNER ═══ -->
  <div id="combo-banner">✨ COMBO! ✨</div>

  <!-- ═══ PAUSE OVERLAY ═══ -->
  <div id="pause-overlay">
    <div id="pause-menu">
      <h2>PAUSED</h2>
      <button class="pause-menu-btn" onclick="togglePause()">▶ RESUME</button>
      <button class="pause-menu-btn" onclick="restartFromPause()">🔄 RESTART</button>
      <button class="pause-menu-btn" id="pause-sound-btn" onclick="toggleMuteFromPause()">🔊 SOUND: ON</button>
    </div>
  </div>

  <!-- ═══ GAME OVER ═══ -->
  <div id="gameover">
    <h1>GAME OVER!</h1>
    <div id="new-best-banner">🌟 NEW BEST! 🌟</div>
    <div class="final-score" id="final-score-txt">Score: 0</div>
    <div class="final-best" id="final-best-txt">Best: 0</div>
    <div class="final-coins" id="final-coins-txt">🪙 Earned: 0</div>
    <button id="restart-btn" onclick="initGame()">▶ PLAY AGAIN</button>
  </div>

  <script>
    /* ═══════════════════════════════════════
       CONSTANTS
    ═══════════════════════════════════════ */
    const COLS = 8, ROWS = 8;

    const BLOCK_COLORS = [
      { bg: '#D62828', shine: '#FF6B6B', shadow: '#8B0000' },
      { bg: '#F46036', shine: '#FFB347', shadow: '#A03000' },
      { bg: '#F7C948', shine: '#FFE680', shadow: '#A08000' },
      { bg: '#3A7D44', shine: '#6FCF7F', shadow: '#1A4020' },
      { bg: '#2D6A9F', shine: '#5DA8E0', shadow: '#0D3060' },
      { bg: '#6B3FA0', shine: '#B07AE0', shadow: '#3A1060' },
    ];

    const SHAPES_DEF = [
      { grid: [[1, 1], [1, 1]], cols: 2 },
      { grid: [[1, 1, 1]], cols: 3 },
      { grid: [[1], [1], [1]], cols: 1 },
      { grid: [[1, 0], [1, 0], [1, 1]], cols: 2 },
      { grid: [[0, 1], [0, 1], [1, 1]], cols: 2 },
      { grid: [[1, 1, 0], [0, 1, 1]], cols: 3 },
      { grid: [[0, 1, 1], [1, 1, 0]], cols: 3 },
      { grid: [[0, 1, 0], [1, 1, 1]], cols: 3 },
      { grid: [[1, 1, 1], [0, 1, 0]], cols: 3 },
      { grid: [[1, 1], [1, 0]], cols: 2 },
      { grid: [[1, 1], [0, 1]], cols: 2 },
      { grid: [[1]], cols: 1 },
      { grid: [[1, 1, 1], [1, 0, 0]], cols: 3 },
      { grid: [[1, 1, 1, 1]], cols: 4 },
    ];

    const LEVEL_THRESHOLDS = [0, 500, 1200, 2500, 4500, 7000, 10000, 15000, 21000, 30000];

    /* ═══════════════════════════════════════
       SOUND MANAGER
    ═══════════════════════════════════════ */
    class SoundManager {
      constructor() {
        this.sounds = {};
        this.bgm = null;
        this.muted = localStorage.getItem('blockhead_muted') === 'true';
        this.bgmPendingStart = false;
      }

      preload() {
        const files = {
          bgm: 'bgm_jazz.mp3', pickup: 'sfx_pickup.mp3', place: 'sfx_place.mp3',
          pop: 'sfx_pop.mp3', combo: 'sfx_combo.mp3', snap: 'sfx_snap.mp3',
          coin: 'sfx_coin.mp3', powerup: 'sfx_powerup.mp3', hammer: 'sfx_hammer.mp3',
          gameover: 'sfx_gameover.mp3', click: 'sfx_click.mp3'
        };
        for (const [key, file] of Object.entries(files)) {
          try {
            const audio = new Audio(file);
            audio.preload = 'auto';
            if (key === 'bgm') { audio.loop = true; audio.volume = 0.25; this.bgm = audio; }
            else { audio.volume = 0.5; }
            this.sounds[key] = audio;
          } catch (e) { /* graceful fail */ }
        }
      }

      play(name) {
        if (this.muted || !this.sounds[name]) return;
        try {
          const clone = this.sounds[name].cloneNode();
          clone.volume = this.sounds[name].volume || 0.5;
          clone.play().catch(() => { });
        } catch (e) { /* graceful fail */ }
      }

      startBGM() {
        if (this.muted || !this.bgm) return;
        const p = this.bgm.play();
        if (p) p.catch(() => {
          this.bgmPendingStart = true;
        });
      }

      stopBGM() {
        if (this.bgm) { this.bgm.pause(); this.bgm.currentTime = 0; }
        this.bgmPendingStart = false;
      }

      resumeBGM() {
        if (this.muted || !this.bgm) return;
        this.bgm.play().catch(() => { });
      }

      pauseBGM() {
        if (this.bgm) this.bgm.pause();
      }

      tryPendingBGM() {
        if (this.bgmPendingStart && !this.muted && this.bgm) {
          this.bgm.play().catch(() => { });
          this.bgmPendingStart = false;
        }
      }

      toggleMute() {
        this.muted = !this.muted;
        localStorage.setItem('blockhead_muted', this.muted);
        if (this.muted) { if (this.bgm) this.bgm.pause(); }
        else { this.startBGM(); }
        return this.muted;
      }
    }

    const sound = new SoundManager();
    sound.preload();

    /* ═══════════════════════════════════════
       GAME STATE
    ═══════════════════════════════════════ */
    let grid = [], score = 0, combo = 0, level = 1;
    let shapes = [null, null, null];
    let CELL_SIZE;

    // Persistent state
    let highScore = 0;
    let coins = 0;

    // Per-game state
    let coinsThisGame = 0;
    let newBestThisGame = false;

    // UI state
    let selectedSlot = null;
    let hammerMode = false;
    let paused = false;
    let isClearing = false;
    let dragging = null;
    let pendingResize = false;
    let previousLevel = 1;

    /* ═══════════════════════════════════════
       INIT
    ═══════════════════════════════════════ */
    function initGame() {
      // Load persistent data
      highScore = parseInt(localStorage.getItem('blockhead_highscore')) || 0;
      coins = parseInt(localStorage.getItem('blockhead_coins')) || 0;

      // Reset per-game state
      score = 0; combo = 0; level = 1; previousLevel = 1;
      coinsThisGame = 0; newBestThisGame = false;
      selectedSlot = null; hammerMode = false;
      paused = false; isClearing = false;

      grid = Array.from({ length: ROWS * COLS }, () => null);

      // Close overlays
      document.getElementById('gameover').style.display = 'none';
      document.getElementById('pause-overlay').style.display = 'none';
      document.getElementById('board-wrapper').classList.remove('hammer-mode');

      // Update displays
      document.getElementById('score-val').textContent = '0';
      document.getElementById('highscore-val').textContent = highScore;
      document.getElementById('coins-val').textContent = coins;
      updateMuteButton();

      // Build
      calcCellSize();
      buildBoard();
      shapes = [null, null, null];
      refillShapes();
      updateProgress();
      updatePowerupButtons();

      // Music
      sound.startBGM();
    }

    /* ═══════════════════════════════════════
       BOARD
    ═══════════════════════════════════════ */
    function calcCellSize() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const headerH = 80, invH = 180, padding = 44;
      const maxByW = Math.floor((vw - 40) / COLS) - 3;
      const maxByH = Math.floor((vh - headerH - invH - padding) / ROWS) - 3;
      CELL_SIZE = Math.max(26, Math.min(44, maxByW, maxByH));
    }

    function buildBoard() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      board.style.gridTemplateColumns = `repeat(${COLS}, ${CELL_SIZE}px)`;
      board.style.gridTemplateRows = `repeat(${ROWS}, ${CELL_SIZE}px)`;
      board.style.gap = '3px';

      for (let i = 0; i < ROWS * COLS; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.i = i;
        board.appendChild(cell);
      }
    }

    function getCells() { return document.getElementById('board').querySelectorAll('.cell'); }

    function paintGrid() {
      const cells = getCells();
      cells.forEach((cell, i) => {
        if (grid[i]) {
          const c = grid[i];
          cell.classList.add('filled');
          cell.style.background = `linear-gradient(135deg, ${c.bg} 60%, ${c.shadow})`;
          cell.style.borderColor = c.shadow;
        } else {
          cell.classList.remove('filled');
          cell.style.background = '';
          cell.style.borderColor = '';
        }
      });
    }

    /* ═══════════════════════════════════════
       SHAPES
    ═══════════════════════════════════════ */
    function randomShape() {
      const src = SHAPES_DEF[Math.floor(Math.random() * SHAPES_DEF.length)];
      const color = BLOCK_COLORS[Math.floor(Math.random() * BLOCK_COLORS.length)];
      // Deep-copy grid so rotation doesn't mutate the template
      return { def: { grid: src.grid.map(r => [...r]), cols: src.cols }, color };
    }

    function refillShapes() {
      for (let s = 0; s < 3; s++) {
        if (!shapes[s]) shapes[s] = randomShape();
      }
      renderInventory();
      checkGameOver();
    }

    function renderInventory() {
      const inv = document.getElementById('inventory');
      inv.innerHTML = '';
      for (let s = 0; s < 3; s++) {
        const slot = document.createElement('div');
        slot.className = 'shape-slot';
        if (s === selectedSlot && shapes[s]) slot.classList.add('selected');
        slot.dataset.slot = s;
        if (shapes[s]) {
          const el = buildShapeEl(shapes[s], s);
          slot.appendChild(el);
        }
        inv.appendChild(slot);
      }
      updatePowerupButtons();
    }

    function buildShapeEl(shapeData, slotIdx) {
      const { def, color } = shapeData;
      const flatCells = def.grid.flat();
      const rows = def.grid.length, cols = def.cols;

      const el = document.createElement('div');
      el.className = 'shape';
      el.dataset.slot = slotIdx;

      const scale = Math.min(1, 68 / (Math.max(rows, cols) * (CELL_SIZE + 3)));
      const bSize = Math.round(CELL_SIZE * scale);

      el.style.gridTemplateColumns = `repeat(${cols}, ${bSize}px)`;
      el.style.gridTemplateRows = `repeat(${rows}, ${bSize}px)`;
      el.style.gap = '3px';
      el.style.position = 'absolute';

      flatCells.forEach(v => {
        const b = document.createElement('div');
        b.className = 'block';
        if (!v) { b.style.visibility = 'hidden'; b.style.pointerEvents = 'none'; }
        else {
          b.style.background = `linear-gradient(135deg, ${color.shine} 0%, ${color.bg} 55%, ${color.shadow} 100%)`;
          b.style.borderColor = color.shadow;
          b.style.width = bSize + 'px';
          b.style.height = bSize + 'px';
        }
        el.appendChild(b);
      });

      setupDragForShape(el, slotIdx);
      return el;
    }

    /* ═══════════════════════════════════════
       DRAG & DROP (Pointer Events)
    ═══════════════════════════════════════ */

    function getDragOffset() {
      return Math.max(30, window.innerHeight * 0.04);
    }

    function setupDragForShape(el, slotIdx) {
      el.addEventListener('pointerdown', (e) => onPointerDown(e, el, slotIdx));
    }

    function onPointerDown(e, el, slotIdx) {
      if (isClearing || paused || hammerMode || dragging) return;
      e.preventDefault();

      const shape = shapes[slotIdx];
      if (!shape) return;

      // Try to start BGM on first interaction (autoplay policy workaround)
      sound.tryPendingBGM();

      dragging = {
        slotIdx,
        def: shape.def,
        color: shape.color,
        el,
        dragEl: null,
        startX: e.clientX,
        startY: e.clientY,
        hasMoved: false
      };

      document.addEventListener('pointermove', globalPointerMove);
      document.addEventListener('pointerup', globalPointerUp);
      document.addEventListener('pointercancel', globalPointerCancel);
    }

    function createDragElement(e) {
      const { def, color } = dragging;
      const rows = def.grid.length, cols = def.cols;
      const offset = getDragOffset();

      const dragEl = document.createElement('div');
      dragEl.className = 'shape dragging';
      dragEl.style.gridTemplateColumns = `repeat(${cols}, ${CELL_SIZE}px)`;
      dragEl.style.gridTemplateRows = `repeat(${rows}, ${CELL_SIZE}px)`;
      dragEl.style.gap = '3px';
      dragEl.style.position = 'fixed';
      dragEl.style.zIndex = 1000;
      dragEl.style.pointerEvents = 'none';

      def.grid.flat().forEach(v => {
        const b = document.createElement('div');
        b.className = 'block';
        b.style.width = CELL_SIZE + 'px';
        b.style.height = CELL_SIZE + 'px';
        if (!v) { b.style.visibility = 'hidden'; }
        else {
          b.style.background = `linear-gradient(135deg, ${color.shine} 0%, ${color.bg} 55%, ${color.shadow} 100%)`;
          b.style.borderColor = color.shadow;
        }
        dragEl.appendChild(b);
      });

      const totalW = cols * CELL_SIZE + (cols - 1) * 3;
      const totalH = rows * CELL_SIZE + (rows - 1) * 3;
      dragEl.style.left = (e.clientX - totalW / 2) + 'px';
      dragEl.style.top = (e.clientY - totalH / 2 - offset) + 'px';

      document.body.appendChild(dragEl);
      dragging.dragEl = dragEl;
      dragging.el.classList.add('shape-ghost');
    }

    function globalPointerMove(e) {
      if (!dragging) return;
      e.preventDefault();

      const dx = e.clientX - dragging.startX;
      const dy = e.clientY - dragging.startY;

      // Movement threshold — distinguish tap from drag
      if (!dragging.hasMoved && Math.sqrt(dx * dx + dy * dy) < 8) return;

      if (!dragging.hasMoved) {
        dragging.hasMoved = true;
        createDragElement(e);
        sound.play('pickup');
      }

      // Move drag element
      const { def } = dragging;
      const rows = def.grid.length, cols = def.cols;
      const totalW = cols * CELL_SIZE + (cols - 1) * 3;
      const totalH = rows * CELL_SIZE + (rows - 1) * 3;
      const offset = getDragOffset();
      dragging.dragEl.style.left = (e.clientX - totalW / 2) + 'px';
      dragging.dragEl.style.top = (e.clientY - totalH / 2 - offset) + 'px';

      // Highlight board cells
      clearHighlights();
      const cells = getTargetCells(e.clientX, e.clientY, def);
      if (cells) {
        const valid = canPlace(cells.indices, grid);
        cells.indices.forEach(i => {
          const cell = document.querySelector(`.cell[data-i="${i}"]`);
          if (cell) cell.classList.add(valid ? 'highlight' : 'highlight-bad');
        });
      }
    }

    function globalPointerUp(e) {
      if (!dragging) return;
      e.preventDefault();

      // Was it a TAP (no significant movement)?
      if (!dragging.hasMoved) {
        selectShape(dragging.slotIdx);
        dragging = null;
        removeDragListeners();
        return;
      }

      clearHighlights();

      const { slotIdx, def, color, dragEl, el } = dragging;
      const cells = getTargetCells(e.clientX, e.clientY, def);
      let placed = false;

      if (cells && canPlace(cells.indices, grid)) {
        // ── PLACE! ──
        cells.indices.forEach(i => {
          grid[i] = color;
          const cell = document.querySelector(`.cell[data-i="${i}"]`);
          if (cell) {
            cell.classList.add('pop-in');
            cell.style.background = `linear-gradient(135deg, ${color.bg} 60%, ${color.shadow})`;
            cell.style.borderColor = color.shadow;
            cell.classList.add('filled');
            setTimeout(() => cell.classList.remove('pop-in'), 400);
          }
        });

        shapes[slotIdx] = null;
        if (selectedSlot === slotIdx) selectedSlot = null;
        placed = true;
        sparkle(e.clientX, e.clientY, color.bg);
        sound.play('place');

        if (dragEl) dragEl.remove();
        el.remove();

        setTimeout(() => {
          checkLines(() => {
            if (shapes.every(s => !s)) refillShapes();
            else { renderInventory(); checkGameOver(); }
          });
        }, 150);
      }

      if (!placed) {
        // Snap back
        if (dragEl) dragEl.remove();
        el.classList.remove('shape-ghost');
        el.classList.add('snap-back');
        setTimeout(() => el.classList.remove('snap-back'), 400);
        sound.play('snap');
      }

      dragging = null;
      removeDragListeners();
    }

    function globalPointerCancel() {
      cleanupDrag();
    }

    function cleanupDrag() {
      if (dragging) {
        if (dragging.dragEl) dragging.dragEl.remove();
        if (dragging.el) {
          dragging.el.classList.remove('shape-ghost');
          dragging.el.classList.add('snap-back');
          setTimeout(() => {
            if (dragging && dragging.el) dragging.el.classList.remove('snap-back');
          }, 400);
        }
        dragging = null;
      }
      clearHighlights();
      removeDragListeners();
    }

    function removeDragListeners() {
      document.removeEventListener('pointermove', globalPointerMove);
      document.removeEventListener('pointerup', globalPointerUp);
      document.removeEventListener('pointercancel', globalPointerCancel);

      if (pendingResize) {
        pendingResize = false;
        handleResize();
      }
    }

    // Safety nets for ghost drag leak
    window.addEventListener('blur', cleanupDrag);
    document.addEventListener('visibilitychange', () => { if (document.hidden) cleanupDrag(); });

    /* ═══════════════════════════════════════
       HIT DETECTION
    ═══════════════════════════════════════ */
    function getTargetCells(px, py, def) {
      const rows = def.grid.length, cols = def.cols;
      const totalW = cols * CELL_SIZE + (cols - 1) * 3;
      const totalH = rows * CELL_SIZE + (rows - 1) * 3;
      const offset = getDragOffset();
      const shapeLeft = px - totalW / 2;
      const shapeTop = py - totalH / 2 - offset;

      const boardEl = document.getElementById('board');
      const boardRect = boardEl.getBoundingClientRect();
      const gap = 3;

      const col0 = Math.round((shapeLeft - boardRect.left - 8) / (CELL_SIZE + gap));
      const row0 = Math.round((shapeTop - boardRect.top - 8) / (CELL_SIZE + gap));

      const indices = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (!def.grid[r][c]) continue;
          const gr = row0 + r, gc = col0 + c;
          if (gr < 0 || gr >= ROWS || gc < 0 || gc >= COLS) return null;
          indices.push(gr * COLS + gc);
        }
      }
      return { indices };
    }

    function canPlace(indices, g) {
      return indices.every(i => i >= 0 && i < ROWS * COLS && !g[i]);
    }

    function clearHighlights() {
      document.querySelectorAll('.cell.highlight, .cell.highlight-bad').forEach(c => {
        c.classList.remove('highlight', 'highlight-bad');
      });
    }

    /* ═══════════════════════════════════════
       LINE CLEARING (with animation lock)
    ═══════════════════════════════════════ */
    function checkLines(callback) {
      let cleared = 0;
      const rowsToClear = [], colsToClear = [];

      for (let r = 0; r < ROWS; r++) {
        if (grid.slice(r * COLS, r * COLS + COLS).every(v => v)) rowsToClear.push(r);
      }
      for (let c = 0; c < COLS; c++) {
        let full = true;
        for (let r = 0; r < ROWS; r++) if (!grid[r * COLS + c]) { full = false; break; }
        if (full) colsToClear.push(c);
      }

      if (!rowsToClear.length && !colsToClear.length) {
        combo = 0;
        if (callback) callback();
        return;
      }

      cleared = rowsToClear.length + colsToClear.length;
      combo++;
      isClearing = true;

      // Gather cells to kill and save colors for particles
      const toKill = new Set();
      rowsToClear.forEach(r => { for (let c = 0; c < COLS; c++) toKill.add(r * COLS + c); });
      colsToClear.forEach(c => { for (let r = 0; r < ROWS; r++) toKill.add(r * COLS + c); });

      const savedColors = {};
      toKill.forEach(i => { savedColors[i] = grid[i]; });

      // Start visual clear animation (grid stays filled during animation)
      toKill.forEach(i => {
        const cell = document.querySelector(`.cell[data-i="${i}"]`);
        if (cell) cell.classList.add('clear-pop');
      });

      // Score
      const pts = cleared * 100 * combo;
      score += pts;
      document.getElementById('score-val').textContent = score;
      const sv = document.getElementById('score-val');
      sv.classList.remove('bump');
      void sv.offsetWidth;
      sv.classList.add('bump');

      updateLevel();
      updateProgress();
      updateHighScore();

      // Coins — earn coins on line clear
      const coinEarn = cleared * 5 + (combo >= 2 ? 10 * combo : 0);
      if (coinEarn > 0) {
        const bx = document.getElementById('board-wrapper');
        const bcx = bx.getBoundingClientRect().left + bx.offsetWidth / 2;
        const bcy = bx.getBoundingClientRect().top + bx.offsetHeight / 2;
        addCoins(coinEarn, bcx, bcy + 30);
      }

      // Score pop
      const bx = document.getElementById('board-wrapper');
      const cx = bx.getBoundingClientRect().left + bx.offsetWidth / 2;
      const cy = bx.getBoundingClientRect().top + bx.offsetHeight / 2;
      showScorePop(cx, cy - 30, '+' + pts);

      // Combo banner
      if (combo >= 2) {
        const banner = document.getElementById('combo-banner');
        banner.textContent = combo + 'x COMBO! 🔥';
        banner.classList.add('show');
        setTimeout(() => banner.classList.remove('show'), 1200);
        sound.play('combo');
      }

      // Colored sparkles using actual block colors
      toKill.forEach(i => {
        const cell = document.querySelector(`.cell[data-i="${i}"]`);
        if (cell) {
          const r = cell.getBoundingClientRect();
          const clr = savedColors[i];
          sparkle(r.left + r.width / 2, r.top + r.height / 2, clr ? clr.bg : '#F7C948');
        }
      });

      sound.play('pop');

      // Shake
      document.getElementById('board-wrapper').classList.add('shake');
      setTimeout(() => document.getElementById('board-wrapper').classList.remove('shake'), 400);

      // After animation: actually clear grid and unlock
      setTimeout(() => {
        toKill.forEach(i => {
          grid[i] = null;
          const cell = document.querySelector(`.cell[data-i="${i}"]`);
          if (cell) {
            cell.classList.remove('clear-pop', 'filled');
            cell.style.background = '';
            cell.style.borderColor = '';
          }
        });
        isClearing = false;
        if (callback) callback();
      }, 320);
    }

    /* ═══════════════════════════════════════
       SCORING, HIGH SCORE & COINS
    ═══════════════════════════════════════ */
    function updateHighScore() {
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('blockhead_highscore', highScore);
        const el = document.getElementById('highscore-val');
        el.textContent = highScore;
        el.classList.remove('new-best-flash');
        void el.offsetWidth;
        el.classList.add('new-best-flash');
        newBestThisGame = true;
      }
    }

    function addCoins(amount, x, y) {
      coins += amount;
      coinsThisGame += amount;
      localStorage.setItem('blockhead_coins', coins);
      document.getElementById('coins-val').textContent = coins;
      const cb = document.getElementById('coins-box');
      cb.classList.remove('bump');
      void cb.offsetWidth;
      cb.classList.add('bump');
      updatePowerupButtons();
      sound.play('coin');
      if (x !== undefined && y !== undefined) showCoinPop(x, y, '+' + amount);
    }

    function spendCoins(amount) {
      if (coins < amount) return false;
      coins -= amount;
      localStorage.setItem('blockhead_coins', coins);
      document.getElementById('coins-val').textContent = coins;
      updatePowerupButtons();
      return true;
    }

    function showScorePop(x, y, text) {
      const el = document.createElement('div');
      el.className = 'score-pop';
      el.textContent = text;
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1000);
    }

    function showCoinPop(x, y, text) {
      const el = document.createElement('div');
      el.className = 'coin-pop';
      el.textContent = text + ' 🪙';
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1000);
    }

    function sparkle(x, y, color) {
      for (let i = 0; i < 10; i++) {
        const s = document.createElement('div');
        s.className = 'spark';
        s.style.left = x + 'px';
        s.style.top = y + 'px';
        s.style.background = color;
        const angle = Math.random() * 360;
        const dist = 30 + Math.random() * 50;
        s.style.setProperty('--tx', Math.cos(angle * Math.PI / 180) * dist + 'px');
        s.style.setProperty('--ty', Math.sin(angle * Math.PI / 180) * dist + 'px');
        s.style.animationDuration = (0.4 + Math.random() * 0.4) + 's';
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 900);
      }
    }

    /* ═══════════════════════════════════════
       SHAPE SELECTION
    ═══════════════════════════════════════ */
    function selectShape(slotIdx) {
      if (!shapes[slotIdx]) return;

      if (selectedSlot === slotIdx) {
        selectedSlot = null;
      } else {
        selectedSlot = slotIdx;
      }

      document.querySelectorAll('.shape-slot').forEach((slot, i) => {
        slot.classList.toggle('selected', i === selectedSlot && shapes[i]);
      });

      updatePowerupButtons();
      sound.play('click');
    }

    /* ═══════════════════════════════════════
       POWER-UPS
    ═══════════════════════════════════════ */
    function updatePowerupButtons() {
      const rotBtn = document.getElementById('btn-rotate');
      const hamBtn = document.getElementById('btn-hammer');
      const refBtn = document.getElementById('btn-refresh');

      rotBtn.classList.toggle('disabled', coins < 20 || selectedSlot === null || !shapes[selectedSlot]);
      hamBtn.classList.toggle('disabled', coins < 30);
      refBtn.classList.toggle('disabled', coins < 40);

      // Keep hammer active state if in hammer mode
      hamBtn.classList.toggle('active', hammerMode);
    }

    function usePowerRotate() {
      if (isClearing || paused) return;
      if (coins < 20) return;
      if (selectedSlot === null || !shapes[selectedSlot]) {
        // Flash inventory to hint "select a shape first"
        const inv = document.getElementById('inventory');
        inv.classList.remove('flash-hint');
        void inv.offsetWidth;
        inv.classList.add('flash-hint');
        return;
      }

      if (!spendCoins(20)) return;

      // Rotate the shape 90° clockwise
      const shape = shapes[selectedSlot];
      const oldGrid = shape.def.grid;
      const oldRows = oldGrid.length;
      const oldCols = shape.def.cols;
      const newGrid = [];
      for (let c = 0; c < oldCols; c++) {
        const row = [];
        for (let r = oldRows - 1; r >= 0; r--) {
          row.push(oldGrid[r][c]);
        }
        newGrid.push(row);
      }
      shape.def = { grid: newGrid, cols: oldRows };

      sound.play('powerup');
      const btn = document.getElementById('btn-rotate');
      btn.classList.remove('used');
      void btn.offsetWidth;
      btn.classList.add('used');

      renderInventory();
      checkGameOver();
    }

    function usePowerHammer() {
      if (isClearing || paused) return;
      if (coins < 30) return;

      // Toggle hammer mode
      hammerMode = !hammerMode;
      document.getElementById('board-wrapper').classList.toggle('hammer-mode', hammerMode);
      updatePowerupButtons();

      if (hammerMode) {
        sound.play('click');
      } else {
        cancelHammer();
      }
    }

    function cancelHammer() {
      hammerMode = false;
      document.getElementById('board-wrapper').classList.remove('hammer-mode');
      updatePowerupButtons();
    }

    function usePowerRefresh() {
      if (isClearing || paused) return;
      if (coins < 40) return;

      // Check if there are any shapes to refresh
      const hasShapes = shapes.some(s => s);
      if (!hasShapes) return;

      if (!spendCoins(40)) return;

      selectedSlot = null;
      shapes = [null, null, null];

      sound.play('powerup');
      const btn = document.getElementById('btn-refresh');
      btn.classList.remove('used');
      void btn.offsetWidth;
      btn.classList.add('used');

      refillShapes();

      // Add spin animation to new shapes
      setTimeout(() => {
        document.querySelectorAll('.shape').forEach(s => {
          s.classList.add('refresh-spin');
          setTimeout(() => s.classList.remove('refresh-spin'), 500);
        });
      }, 50);
    }

    /* ── Hammer board interaction ── */
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('board').addEventListener('pointerdown', (e) => {
        if (!hammerMode) return;
        e.preventDefault();
        e.stopPropagation();

        const cell = e.target.closest('.cell');
        if (!cell) { cancelHammer(); return; }

        const i = parseInt(cell.dataset.i);
        if (!grid[i]) { cancelHammer(); return; }

        // Destroy this block
        const color = grid[i];
        grid[i] = null;
        cell.classList.add('hammer-smash');
        setTimeout(() => {
          cell.classList.remove('hammer-smash', 'filled');
          cell.style.background = '';
          cell.style.borderColor = '';
        }, 350);

        const r = cell.getBoundingClientRect();
        sparkle(r.left + r.width / 2, r.top + r.height / 2, color.bg);

        // Deduct coins
        spendCoins(30);
        sound.play('hammer');

        // Exit hammer mode
        cancelHammer();

        // Re-check if game is still over (might have opened a spot)
        checkGameOver();
      });
    });

    /* ═══════════════════════════════════════
       PAUSE SYSTEM
    ═══════════════════════════════════════ */
    function togglePause() {
      if (document.getElementById('gameover').style.display === 'flex') return;

      paused = !paused;
      document.getElementById('pause-overlay').style.display = paused ? 'flex' : 'none';
      sound.play('click');

      if (paused) {
        sound.pauseBGM();
        if (dragging) cleanupDrag();
        if (hammerMode) cancelHammer();
      } else {
        sound.resumeBGM();
      }
    }

    function restartFromPause() {
      paused = false;
      document.getElementById('pause-overlay').style.display = 'none';
      sound.stopBGM();
      initGame();
    }

    function toggleMuteFromPause() {
      const muted = sound.toggleMute();
      updateMuteButton();
      document.getElementById('pause-sound-btn').textContent = muted ? '🔇 SOUND: OFF' : '🔊 SOUND: ON';
    }

    /* ═══════════════════════════════════════
       MUTE SYSTEM
    ═══════════════════════════════════════ */
    function toggleMute() {
      sound.tryPendingBGM();
      const muted = sound.toggleMute();
      updateMuteButton();
    }

    function updateMuteButton() {
      document.getElementById('mute-btn').textContent = sound.muted ? '🔇' : '🔊';
      const pauseBtn = document.getElementById('pause-sound-btn');
      if (pauseBtn) pauseBtn.textContent = sound.muted ? '🔇 SOUND: OFF' : '🔊 SOUND: ON';
    }

    /* ═══════════════════════════════════════
       LEVEL & PROGRESS
    ═══════════════════════════════════════ */
    function updateLevel() {
      for (let i = LEVEL_THRESHOLDS.length - 1; i >= 0; i--) {
        if (score >= LEVEL_THRESHOLDS[i]) { level = i + 1; break; }
      }
      document.getElementById('level-txt').textContent = 'LV ' + level;

      // Level up bonus coins
      if (level > previousLevel) {
        previousLevel = level;
        const bx = document.getElementById('board-wrapper');
        const bcx = bx.getBoundingClientRect().left + bx.offsetWidth / 2;
        const bcy = bx.getBoundingClientRect().top + 20;
        addCoins(25, bcx, bcy);
      }
    }

    function updateProgress() {
      const nextIdx = Math.min(level, LEVEL_THRESHOLDS.length - 1);
      const prevVal = LEVEL_THRESHOLDS[level - 1] || 0;
      const nextVal = LEVEL_THRESHOLDS[nextIdx] || LEVEL_THRESHOLDS[LEVEL_THRESHOLDS.length - 1];
      const pct = nextVal === prevVal ? 100 : Math.min(100, ((score - prevVal) / (nextVal - prevVal)) * 100);
      document.getElementById('progress-bar').style.width = pct + '%';
    }

    /* ═══════════════════════════════════════
       GAME OVER
    ═══════════════════════════════════════ */
    function checkGameOver() {
      const available = shapes.filter(s => s);
      if (!available.length) return;
      const canPlayAny = available.some(s => canShapeFit(s.def));
      if (!canPlayAny) {
        setTimeout(() => showGameOver(), 600);
      }
    }

    function showGameOver() {
      updateHighScore();
      sound.play('gameover');
      sound.stopBGM();

      document.getElementById('final-score-txt').textContent = 'Score: ' + score;
      document.getElementById('final-best-txt').textContent = 'Best: ' + highScore;
      document.getElementById('final-coins-txt').textContent = '🪙 Earned: ' + coinsThisGame;
      document.getElementById('new-best-banner').style.display = newBestThisGame ? 'block' : 'none';

      document.getElementById('gameover').style.display = 'flex';

      if (hammerMode) cancelHammer();
    }

    function canShapeFit(def) {
      for (let r = 0; r <= ROWS - def.grid.length; r++) {
        for (let c = 0; c <= COLS - def.cols; c++) {
          const indices = [];
          let ok = true;
          for (let dr = 0; dr < def.grid.length && ok; dr++) {
            for (let dc = 0; dc < def.cols && ok; dc++) {
              if (!def.grid[dr][dc]) continue;
              const i = (r + dr) * COLS + (c + dc);
              if (grid[i]) ok = false;
              else indices.push(i);
            }
          }
          if (ok && indices.length) return true;
        }
      }
      return false;
    }

    /* ═══════════════════════════════════════
       RESIZE (with drag guard)
    ═══════════════════════════════════════ */
    function handleResize() {
      calcCellSize();
      buildBoard();
      paintGrid();
      renderInventory();
    }

    window.addEventListener('resize', () => {
      if (dragging) {
        pendingResize = true;
        return;
      }
      handleResize();
    });

    /* ═══════════════════════════════════════
       START!
    ═══════════════════════════════════════ */
    initGame();
  </script>
</body>
